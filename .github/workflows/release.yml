name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  check-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 0

      # Stable releases come from main, pre-releases from experimental (see RELEASING.md)
      - name: Check the tag is on its release branch
        env:
          TAG: ${{ github.ref_name }}
        run: |
          branch=main
          [[ "${TAG}" == *-* ]] && branch=experimental
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/${branch}"; then
            echo "::error::${TAG} is not on ${branch}; tags with a '-' release from experimental, the rest from main"
            exit 1
          fi

  build:
    needs: check-tag
    # build.yml's publish job, skipped for tags, still needs these to be allowed
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.ref_name }}

  release:
    needs: build
    if: needs.build.outputs.has-source == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ServerCore
          path: dist/Mods/ServerCore

      - name: Package and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          (cd dist && zip -r -X "ServerCore-${version}.zip" Mods)
          source scripts/lib/changelog.sh
          changelog_notes "${version}" > dist/notes.md
          if [[ ! -s dist/notes.md ]]; then
            echo "::error::CHANGELOG.md has no section for [${version}]"
            exit 1
          fi
          prerelease=()
          [[ "${TAG}" == *-* ]] && prerelease=(--prerelease)
          gh release create "${TAG}" "dist/ServerCore-${version}.zip" \
            --title "ServerCore ${version}" --notes-file dist/notes.md "${prerelease[@]}"
