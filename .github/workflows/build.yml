name: Build

on:
  push:
    branches: [main, experimental]
  pull_request:
  workflow_call:
    inputs:
      version:
        description: Version stamped into ModInfo.xml; a leading v is stripped
        type: string
        required: false
    outputs:
      has-source:
        description: Whether a C# project was found and built
        value: ${{ jobs.build.outputs.has-source }}

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      has-source: ${{ steps.source.outputs.has-source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Cache game references
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            _data/7dtd-binaries
            _data/tools
          key: game-refs-${{ hashFiles('game-version.json', 'scripts/fetch-game-refs.sh') }}

      - name: Fetch game references
        run: ./scripts/fetch-game-refs.sh

      - name: Cache Web UI
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: _data/web-ui
          key: web-ui-${{ hashFiles('web-ui-version.json', 'scripts/fetch-web-ui.sh') }}

      - name: Fetch Web UI
        run: ./scripts/fetch-web-ui.sh

      - name: Look for source
        id: source
        run: |
          if find . -path ./_data -prune -o \( -name '*.sln' -o -name '*.csproj' \) -print | grep -q .; then
            echo "has-source=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No C# project in the repository yet; skipping the build."
            echo "has-source=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v5
        if: steps.source.outputs.has-source == 'true'
        with:
          dotnet-version: 8.0.x

      - name: Build
        if: steps.source.outputs.has-source == 'true'
        run: dotnet build -c Release -p:Deterministic=true

      - name: Check no game assemblies are packaged
        if: steps.source.outputs.has-source == 'true'
        run: |
          leaked=$(comm -12 <(ls Mods/ServerCore | sort) <(ls _data/7dtd-binaries | sort))
          if [[ -n "${leaked}" ]]; then
            echo "::error::Game assemblies in the build output (set <Private>false</Private> on their references):"
            echo "${leaked}"
            exit 1
          fi

      - name: Check the mod folder contents
        if: steps.source.outputs.has-source == 'true'
        run: |
          expected=$'ClaimCreator\nConfig\nLiteDB.dll\nModInfo.xml\nServerCore.dll\nsteam-intermediate.cer\nsteam-rootca.cer'
          actual=$(ls -A Mods/ServerCore | sort)
          if [[ "${actual}" != "${expected}" ]]; then
            echo "::error::Unexpected files in Mods/ServerCore:"
            diff <(echo "${expected}") <(echo "${actual}") || true
            exit 1
          fi
          if [[ ! -f Mods/ServerCore/ClaimCreator/index.html ]]; then
            echo "::error::Mods/ServerCore/ClaimCreator has no index.html"
            exit 1
          fi
          if [[ ! -f Mods/ServerCore/Config/buffs.xml ]]; then
            echo "::error::Mods/ServerCore/Config has no buffs.xml"
            exit 1
          fi

      - name: Stamp version
        if: steps.source.outputs.has-source == 'true' && inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: sed -i -E "s|(<Version value=\")[^\"]*|\1${VERSION#v}|" Mods/ServerCore/ModInfo.xml

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: steps.source.outputs.has-source == 'true'
        with:
          name: ServerCore
          path: Mods/ServerCore/
          if-no-files-found: error

  # Branch pushes update the rolling-<branch> pre-release; PRs get a pr-<number> pre-release
  # and a comment. Fork PRs only get a read-only token, so they build without publishing.
  publish:
    needs: build
    if: >-
      needs.build.outputs.has-source == 'true'
      && ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/experimental'))
      || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ServerCore
          path: dist/Mods/ServerCore

      - name: Publish the development build
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.ref_name == 'main' && 'stable' || 'experimental') }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: scripts/dev-build.sh publish "${CHANNEL}" "${SHA}" dist
